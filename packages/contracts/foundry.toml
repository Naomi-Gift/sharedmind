[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc_version   = "0.8.20"
optimizer      = true
optimizer_runs = 200
evm_version    = "paris"
via_ir         = true

# Remappings — installed via forge install
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
kite      = "${KITE_RPC_URL}"

[etherscan]
# Kite chain block explorer (update URL when available)
kite = { key = "${KITE_EXPLORER_API_KEY}", url = "${KITE_EXPLORER_URL}" }
